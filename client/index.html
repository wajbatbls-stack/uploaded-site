      /* v20-purgex — مسح إجباري مباشر: يُلغي كل خدمة خلفية قديمة ويحذف كل كاشاتها فور تحميل الصفحة، ثم يسجل purgex-v20 بمسار جديد كليًا كمؤمّنة أخيرة. مرة واحدة لكل جلسة عبر localStorage. */
      (function __wpV20Purge() {
        var SESSION_KEY = "__wp_purge_v20";
        try {
          if (window.localStorage && window.localStorage.getItem(SESSION_KEY)) return;
          if ("caches" in window) {
            void caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))));
          }
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              Promise.all(regs.map(r => r.unregister())).catch(() => {});
            }).catch(() => {});
            try {
              navigator.serviceWorker.register("/sw-purgex-v20.js?u=v20").catch(() => {});
            } catch (_) {}
          }
          if (window.localStorage) window.localStorage.setItem(SESSION_KEY, "1");
        } catch (_) {}
      })();
    </script>
