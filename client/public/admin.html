<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>لوحة المالك | واجبات بلس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="/assets/css/admin-r14.css" />
    <link rel="stylesheet" href="/assets/css/admin-owner-login-r13-mobile.css" />
    <link rel="stylesheet" href="/assets/css/admin-homepage-r1.css" />
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module">
      const adminModule = document.createElement("script");
      adminModule.type = "module";
      adminModule.src = "/assets/js/admin-app-r16.js";
      adminModule.onload = () => {
        const mediaBinding = document.createElement("script");
        mediaBinding.src = "/assets/js/admin-media-binding-core.js";
        mediaBinding.async = false;
        mediaBinding.onload = () => {
          const structuredEditor = document.createElement("script");
          structuredEditor.src = "/assets/js/admin-structured-editor.js";
          structuredEditor.async = false;
          structuredEditor.onload = () => {
            const homepageManager = document.createElement("script");
            homepageManager.src = "/assets/js/admin-homepage-manager-r1.js";
            homepageManager.async = false;
            document.body.append(homepageManager);
          };
          document.body.append(structuredEditor);
        };
        mediaBinding.onerror = () => {
          const structuredEditor = document.createElement("script");
          structuredEditor.src = "/assets/js/admin-structured-editor.js";
          structuredEditor.onload = () => {
            const homepageManager = document.createElement("script");
            homepageManager.src = "/assets/js/admin-homepage-manager-r1.js";
            document.body.append(homepageManager);
          };
          document.body.append(structuredEditor);
        };
        document.body.append(mediaBinding);
        const designStudio = document.createElement("script");
        designStudio.src = "/assets/js/admin-design-studio-r2.js";
        designStudio.defer = true;
        document.body.append(designStudio);
        const ownerLoginSecurity = document.createElement("script");
        ownerLoginSecurity.src = "/assets/js/admin-owner-login-security-r6.js";
        ownerLoginSecurity.defer = true;
        document.body.append(ownerLoginSecurity);
        const securityControls = document.createElement("script");
        securityControls.src = "/assets/js/admin-security-controls.js";
        securityControls.defer = true;
        document.body.append(securityControls);
        const listControls = document.createElement("script");
        const listCore = document.createElement("script");
        listCore.src = "/assets/js/admin-list-controls-core.js";
        listCore.async = false;
        listCore.onload = () => {
          listControls.src = "/assets/js/admin-list-controls.js";
          listControls.async = false;
          document.body.append(listControls);
        };
        listCore.onerror = () => {
          listControls.src = "/assets/js/admin-list-controls.js";
          document.body.append(listControls);
        };
        document.body.append(listCore);
        const ownerLoginEnhancements = document.createElement("script");
        ownerLoginEnhancements.src = "/assets/js/admin-owner-login-enhancements-r14.js";
        ownerLoginEnhancements.async = false;
        document.body.append(ownerLoginEnhancements);
      };
      document.body.append(adminModule);
    </script>
  </body>
</html>
